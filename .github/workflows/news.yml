name: AI News Pipeline

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC). Minimum allowed interval is 5 min.
  workflow_dispatch:         # lets you run it manually from the Actions tab

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps data/processed.json between runs so nothing is posted twice
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data/processed.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Write credentials
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          mkdir -p data
          echo "$BLOGGER_TOKEN_JSON" > data/blogger_token.json
          if [ -n "$TELEGRAM_SESSION_B64" ]; then
            echo "$TELEGRAM_SESSION_B64" | base64 -d > data/telegram.session
          fi

      - name: Run pipeline once
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
          TELEGRAM_CHANNELS: ${{ vars.TELEGRAM_CHANNELS }}
          TWITTER_USERNAMES: ${{ vars.TWITTER_USERNAMES }}
          PUBLISH_AS_DRAFT: ${{ vars.PUBLISH_AS_DRAFT || 'true' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
        run: python main.py --once
